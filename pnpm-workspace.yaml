packages:
  - apps/*
  - packages/*

catalog:
  # runtime compartilhado
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6
  "@types/node": ^22.13.14

  # web / react
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  next: ^16.2.11
  tailwindcss: ^4.3.2
  lucide-react: ^1.23.0
  next-themes: ^0.4.6
  sonner: ^2.0.7

  # agente (eve + AI SDK 7)
  eve: ^0.27.6
  ai: ^7.0.37

  # auth e dados
  better-auth: ^1.6.25
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  "@vercel/blob": ^2.6.1

  # --- TRANSITÓRIO: só para o scaffold antigo (apps/server, packages/api, apps/web/Vite)
  # instalar sem quebrar. Remover junto com esses pacotes na Etapa 0.
  hono: ^4.12.27
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  "@types/bun": ^1.3.14

allowBuilds:
  sharp: false

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
