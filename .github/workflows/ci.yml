# O gate que faltava.
#
# Até aqui o repositório tinha DOIS workflows — `db-migrate` e
# `agent-behavior-monitor` — e nenhum deles rodava `pnpm test`. A suíte existia,
# era boa, e nunca executava num PR. A consequência não é hipotética: um teste
# em `packages/agent/tests/tools/agent-artifacts.test.ts` chegou a FIXAR um bug
# como contrato (métrica de topo R$ 130,00 com linhas somando R$ 150,00) e
# ninguém viu, porque nada nunca falhou.
#
# Este job existe para que um número errado passe a doer no lugar certo.
#
# Por que um Postgres de verdade, e não mock: a suíte testa o contrato entre as
# tools e o banco — RLS, triggers de imutabilidade, isolamento por tenant. Com
# banco falso ela testaria a si mesma. `scripts/ci-db.sh` reproduz os dois
# papéis que o código exige (dono do schema e papel de aplicação sem
# BYPASSRLS), porque `forTenant` recusa conectar como superuser e sem isso a
# política de linha viraria enfeite.
name: ci

on:
  pull_request:
  push:

concurrency:
  # Um push novo no mesmo ramo torna o run anterior irrelevante. Em `main` não
  # cancelamos: cada commit da linha principal merece seu próprio veredicto.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          # Sem senha nenhuma, e não uma senha de brincadeira.
          #
          # A primeira versão declarava uma senha fixa para o superusuário.
          # Funcionava, e foi recusada: um scanner de segredos não distingue
          # senha de brincadeira de senha de verdade — e nem deveria, porque
          # quem lê o arquivo também não, e a de brincadeira acaba copiada para
          # um lugar onde não é. É a mesma razão que `scripts/dev-db.sh` já
          # documenta para não trazer literal nenhum.
          #
          # `trust` é seguro AQUI e só aqui: o container é efêmero, vive na rede
          # privada do runner, é destruído com o job e nunca guarda dado real.
          # Os papéis que a suíte de fato usa (`clara_owner` e `clara_app`)
          # recebem senha gerada por execução em `scripts/ci-db.sh`.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Sem isto os passos começam antes de o banco aceitar conexão, e a
        # falha aparece como "connection refused" no meio da migração.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Lê a versão do pnpm do campo `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Cria clara_owner (dono, NOSUPERUSER) e clara_app (aplicação, sem
      # BYPASSRLS), o banco, as extensões e o GRANT que a limpeza entre testes
      # exige. Exporta DATABASE_URL e DATABASE_ADMIN_URL para os passos
      # seguintes via $GITHUB_ENV.
      - name: Preparar o banco
        env:
          CLARA_SUPERUSER_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: ./scripts/ci-db.sh

      # Direto pelo pnpm, não pelo turbo: a tarefa `db:migrate` está marcada
      # como `persistent` no turbo.json (ela é interativa em desenvolvimento),
      # e tarefa persistente não pode participar de um pipeline.
      - name: Aplicar migrações
        run: pnpm --filter @clara-financas/db db:migrate

      - name: Conferir tipos
        run: pnpm check-types

      - name: Rodar a suíte
        run: pnpm test

  # O gate que faltava para o outro lado do monorepo: `services/agent`
  # (Python/Agno) tinha suíte, ruff e mypy limpos localmente e nenhuma
  # execução em CI — a mesma lacuna que o job `verify` fechou para o lado
  # TypeScript, só que never fechada aqui. Job separado, e não passo a mais
  # no `verify`: runner e Postgres próprios, sem a suíte Python esperar o
  # `pnpm install` do lado TypeScript nem competir pela mesma porta 5432.
  verify-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: services/agent

    steps:
      - uses: actions/checkout@v4

      # Pinado por hash de commit, não por tag de major — a partir da v8 o
      # projeto parou de publicar tags móveis (`@v10`), só releases imutáveis.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Instalar dependências
        run: uv sync --all-extras --frozen

      # Reaproveita o mesmo script de papéis do job `verify` — ele não
      # conhece Drizzle nem Alembic, só cria `clara_owner`/`clara_app`, o
      # banco e as extensões. `working-directory` é sobrescrito aqui porque
      # o script vive na raiz do repositório, não em `services/agent`.
      - name: Preparar o banco
        working-directory: .
        env:
          CLARA_SUPERUSER_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: ./scripts/ci-db.sh

      # `DATABASE_URL`/`DATABASE_ADMIN_URL` já estão no ambiente do job desde
      # o passo anterior (`ci-db.sh` os grava em `$GITHUB_ENV`). A migração
      # 0001 cria `clara_owner`/`clara_app` com `IF NOT EXISTS` caso ainda não
      # existam — aqui já existem, então ela só aplica schema, RLS, triggers
      # e o schema `agno`.
      - name: Aplicar migrações
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check clara/ tests/

      # Informativo, não bloqueante: 31 erros pré-existentes (nenhum em
      # arquivo tocado por esta suíte de mudanças) continuam sem correção —
      # sobretudo em `write_proposed_batch.py`, `ledger/analysis.py` e
      # `ledger/series.py`. Bloquear o PR nisso agora tornaria o gate
      # permanentemente vermelho por um motivo que ninguém tocou, o que
      # ensina a ignorar CI em vez de confiar nela. Ver `docs/ledger-python.md`.
      - name: Tipos (mypy) — informativo
        continue-on-error: true
        run: uv run mypy clara/

      # Nenhum teste chama a OpenAI de verdade — a suíte testa tools como
      # funções contra Postgres real, nunca através de um run de modelo.
      # `OPENAI_API_KEY` só precisa existir para `clara.agents.models`
      # resolver o nome do modelo na hora de montar o Team em memória.
      - name: Rodar a suíte
        env:
          AGENT_TOKEN_SECRET: ci-secret-not-for-production-use-only
          APP_ORIGIN: http://localhost:3000
          OPENAI_API_KEY: sk-ci-placeholder-never-called
        run: uv run pytest
